<!DOCTYPE HTML//EN" "http://www.w3.org/TR/REC-html40/strict.dtd">

<!-- The following is to pick up jquery -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<script>

function doPlayCallback(responseText) {
    // alert(responseText);

    try {
        // The responseText is a JSON string like
        //   {"display":"This is the display text","matchesRemaining":"35"}
        var response = JSON.parse(responseText);
        var displayElt = document.matchesGame.display;

        // alert(response.display);

        // Now append the message onto the screen.
        displayElt.value += response.display;

        // Scroll to the end of the display
        displayElt.scrollTop = displayElt.scrollHeight;

        // And also put the number of matches remaining
        document.matchesGame.matchesRemaining.value = response.matchesRemaining;
    } catch (error) {
        alert("JSON parse error");
        alert(error);
    }
}


function play() {
    var takenElt = document.getElementById("taken");
    var taken = takenElt.value;
    var matchesRemainingElt = document.getElementById("matchesRemaining");
    var matchesRemaining = matchesRemainingElt.value;
    var serverURL = "$ServerURL";

    var userJsonStr;

    var jsonData = { matchesRemaining: `${matchesRemaining}`, taken: `${taken}` };

    // Send the data to the server as a JSON string
    var toServer = JSON.stringify(jsonData);

    // alert(toServer);

    // Send the data to the server using AJAX
    // See documentation in https://api.jquery.com/jQuery.ajax/
    $.ajax({
        url: serverURL,   // "http://localhost:8080/",
        type: "POST",
        data: toServer,
        // This is the request content type.  The request is in JSON.
        // The available contentTypes are:
        //    default   : "application/x-www-form-urlencoded; charset=UTF-8"
        //    json      : "application/json; charset=utf-8"
        //    plain text: "text/plain"
        contentType: "application/json; charset=utf-8",
        // This is the response data type.  The response is also in json.
        // The available datatypes are: 
        //    "text", "html", "xml", "json", "jsonp", "script"
        // If json is specified, the response is parsed using jQuery.parseJSON 
        // before being passed, as an object, to the success handler. 
        datatype: "json",

        success: function(responseText) {
            doPlayCallback(responseText);
        },

        error: function(xhr, status, error) {
            alert(xhr.response.txt);
        }
    });
}


function clearDisplay() {
    // alert("--->1");
    document.matchesGame.display.value = "";
}


</script>

<html>
  <body bgcolor="#cccccc" text="#000000">
    <p>
    <form name="matchesGame" action="response" method="post">
	Matches :
	<input type="text" id="matchesRemaining" value="25">
	<p>
	Player  :
	<select id="taken">
	   <option value="1">1 Match
	   <option value="2">2 Matches
	   <option value="3">3 Matches
	   <option value="4">4 Matches
	</select>
	<p>
 	<button id="playButton" type="button" onclick="play();">Play</button>
        <button id="clearButton" type="button" onclick="clearDisplay();">Clear</button>
	<p>
	<textarea id="display" 
                  defaultValue="" 
                  rows=4 cols=50 
                  style="overflow=scroll;"></textarea>
    </form>
  </body>
</html>
